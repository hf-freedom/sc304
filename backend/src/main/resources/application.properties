server.port=8001
spring.application.name=ticket-seat-system

# 跨域配置
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# 锁座超时时间（秒）
seat.lock.timeout=300

# 临近开场时间（分钟）
show.nearest.time=30

# 高频锁座阈值
lock.frequency.threshold=10
lock.frequency.window=60

# 定时任务配置
scheduled.lock.release=*/10 * * * * ?
scheduled.show.status.update=0 */1 * * * ?
